name: Installation and usage feedback
description: Share installation friction, useful catches, missed failures or continued use.
title: '[Feedback] Installation and use'
body:
  - type: markdown
    attributes:
      value: |
        Thank you for trying Retry Guard. This issue is public and participation is optional.
        Share only the fields below, not API keys, prompts, raw tool arguments or full session logs.
        A later update after 48 hours of use is welcome. No automatic tracking is used.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: DSH version, Node version, operating system and browser.
      placeholder: DSH Web 0.2.0-rc.2, Node 24, macOS, Chrome
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Retry Guard version
      placeholder: 0.1.0-alpha.2
    validations:
      required: true
  - type: input
    id: install-time
    attributes:
      label: Minutes to a working plugin
      description: Start when you open the installation instructions. Include enabling the plugin, finding settings and saving your chosen mode. Record optional source-demo setup time separately. Say 'could not install' if blocked.
    validations:
      required: true
  - type: textarea
    id: assistance
    attributes:
      label: Help needed or installation friction
      description: Write 'none' if you completed the instructions without help.
    validations:
      required: true
  - type: dropdown
    id: retained-use
    attributes:
      label: Continued use
      options:
        - 'Pending — 48 hours have not passed'
        - 'Still enabled and used in my work'
        - 'Still enabled but not used'
        - 'Disabled or removed'
        - 'Could not install'
        - 'Not reporting continued use'
    validations:
      required: false
  - type: textarea
    id: follow-up
    attributes:
      label: Useful catches, missed failures, false pauses or reason to keep or remove
      description: Describe what happened without private task details. If returning later, say roughly how much time has passed. Tool names are optional.
